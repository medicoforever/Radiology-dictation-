    <script>
      // Apply theme from localStorage before page load to prevent flash of unstyled content.
      try {
        const storedTheme = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', storedTheme);
        document.documentElement.classList.add('theme-' + storedTheme);
        if (['dark', 'magical', 'sunset', 'ocean', 'aurora', 'cyberpunk', 'velvet', 'espresso'].includes(storedTheme)) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (_) {}

      // Auto-migrate legacy default model from cached storage to gemini-4-hydrogen
      try {
        ['radiologyDictationSingleMode', 'radiologyDictationBatchMode'].forEach(function(k) {
          var raw = localStorage.getItem(k);
          if (raw && raw.indexOf('gemini-3.5-flash') !== -1) {
            var updated = raw.replace(/"selectedModel"\s*:\s*"gemini-3\.5-flash"/g, '"selectedModel":"gemini-4-hydrogen"');
            if (updated !== raw) {
              localStorage.setItem(k, updated);
            }
          }
        });
      } catch (_) {}

      // Auto-update service worker to guarantee immediate cache-refresh
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          for (var reg of regs) {
            reg.update();
          }
        });
      }
    </script>
