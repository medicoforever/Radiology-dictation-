<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/yinyang-mic.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <title>☯️RADDOC's Dictation app</title>
    <meta name="description" content="An AI-powered tool for radiologists to record audio dictations and receive corrected, clean text transcripts with smart voice commands and impression generation." />
    <meta property="og:title" content="☯️RADDOC's Dictation app" />
    <meta property="og:description" content="An AI-powered tool for radiologists to record audio dictations and receive corrected, clean text transcripts with smart voice commands and impression generation." />
    <script>
      // Apply theme from localStorage before page load to prevent flash of unstyled content.
      if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark')
      } else {
        document.documentElement.classList.remove('dark')
      }
    </script>
  </head>
  <body class="bg-gray-50 dark:bg-slate-900">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
